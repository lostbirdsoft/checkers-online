<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17191f">
  <title>Шашки онлайн</title>
  <link rel="stylesheet" href="style.css?v=2">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Если игра открыта без комнаты (из меню бота), сразу прячем игровую доску, чтобы она не мелькала перед стартовым меню.
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var room = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("room");
      if (!room) document.documentElement.setAttribute("data-menu-start", "1");
    })();
  </script>
  <style>
    html[data-menu-start] body > :not(script):not(#mainMenu):not(#bootBg) { visibility: hidden; }

    /* Заставка до загрузки меню: та же наклонная доска, что и в фоне меню, чтобы не было пустого чёрного экрана. */
    #bootBg { display: none; }
    html[data-menu-start] #bootBg { display: block; position: fixed; inset: 0; z-index: 9300; overflow: hidden; background: var(--bg, #111319); pointer-events: none; }
    #bootStage {
      position: absolute; left: 50%; top: 50%; width: 130vmin; height: 130vmin; margin: -65vmin 0 0 -65vmin; opacity: .55;
      transform: perspective(1100px) rotateX(58deg) rotateZ(-32deg); border: 6px solid #3a2f22; box-shadow: 0 30px 60px rgba(0,0,0,.6);
      background: conic-gradient(#161923 25%, #2e3448 0 50%, #161923 0 75%, #2e3448 0) 0 0 / 25% 25%;
    }
    #bootVignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(17,19,25,.15) 0%, rgba(17,19,25,.9) 100%); }
  </style>
  <script type="module">
    // app.js загружается с меткой времени (раз в минуту), поэтому после обновления файла на GitHub
    // его больше не нужно "будить" ручной сменой версии в этой строке.
    import("./app.js?t=" + Math.floor(Date.now() / 60000)).catch((error) => {
      // Если app.js не загрузился или в нём ошибка, показываем причину вместо молчаливой пустой страницы.
      const text = "Не удалось запустить игру: " + (error && error.message ? error.message : error);
      try { window.Telegram.WebApp.showAlert(text.slice(0, 250)); } catch (e) { alert(text); }
    });
  </script>
</head>
<body>
  <div id="bootBg"><div id="bootStage"></div><div id="bootVignette"></div></div>
  <script>
    // Расставляем шашки на заставке (начальная позиция, как в фоне меню).
    (function () {
      var stage = document.getElementById("bootStage");
      for (var i = 0; i < 64; i++) {
        var row = Math.floor(i / 8), col = i % 8;
        if ((row + col) % 2 !== 1 || (row > 2 && row < 5)) continue;
        var red = row > 4;
        var node = document.createElement("div");
        node.style.cssText = "position:absolute;width:12.5%;height:12.5%;left:" + col * 12.5 + "%;top:" + row * 12.5 + "%";
        var disc = document.createElement("div");
        disc.style.cssText = "margin:11%;height:78%;border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,.6);background:" +
          (red ? "radial-gradient(circle at 35% 30%, #e0604f, #a8362b)" : "radial-gradient(circle at 35% 30%, #4a4f5c, #14171e)");
        node.appendChild(disc);
        stage.appendChild(node);
      }
    })();
  </script>
  <main class="game">
    <header class="topbar">
      <div>
        <div class="eyebrow">LOSTBIRD SOFT</div>
        <h1>Шашки онлайн</h1>
      </div>
      <div class="room-tag" id="roomInfo">КОМНАТА</div>
    </header>

    <section class="players" aria-label="Игроки">
      <div class="player-card" id="playerCard2">
        <span class="piece-dot black-dot"></span>
        <div class="player-meta">
          <span class="player-label">ЧЁРНЫЕ · ИГРОК 2</span>
          <strong id="player2Name">Ожидание игрока</strong>
        </div>
        <span class="player-state" id="player2State">ОЖИДАНИЕ</span>
      </div>
      <div class="player-card" id="playerCard1">
        <span class="piece-dot red-dot"></span>
        <div class="player-meta">
          <span class="player-label">КРАСНЫЕ · ИГРОК 1</span>
          <strong id="player1Name">Ожидание игрока</strong>
        </div>
        <span class="player-state" id="player1State">ОЖИДАНИЕ</span>
      </div>
    </section>

    <section class="game-panel">
      <div class="game-heading">
        <div>
          <div class="eyebrow">ТЕКУЩАЯ ПАРТИЯ</div>
          <h2 id="turnInfo">Подключение...</h2>
        </div>
        <span class="game-status" id="gameStatus">ПОДКЛЮЧЕНИЕ</span>
      </div>

      <div id="board" class="board" aria-label="Игровая доска 8 на 8"></div>

      <div class="board-legend">
        <span><i class="legend-dot red-dot"></i> Красные</span>
        <span><i class="legend-dot black-dot"></i> Чёрные</span>
        <span>♛ Дамка</span>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">Подключаемся к Firebase...</p>

    <section class="actions">
      <button id="drawButton" class="button button-secondary" type="button" disabled>Предложить ничью</button>
      <button id="resignButton" class="button button-danger" type="button" disabled>Сдаться</button>
      <button id="rematchButton" class="button button-primary" type="button" hidden>Реванш</button>
    </section>

    <footer>Русские шашки · 8 × 8</footer>
  </main>
</body>
</html>
